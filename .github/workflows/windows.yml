name: Build Windows x64 installer

on:
  push:
    branches: [ main ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          default: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build and package (PowerShell)
        run: |
          powershell -ExecutionPolicy ByPass -File .\scripts\build-windows.ps1

      - name: Test installer (PowerShell)
        run: |
          powershell -ExecutionPolicy ByPass -File .\scripts\test-installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: zed-windows-x64-installer
          path: dist/windows-x64/

      - name: Upload installed folder (test)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zed-windows-x64-installed
          path: C:\\temp\\zed-test

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: zed-windows-x64-installer
          path: dist/windows-x64/
